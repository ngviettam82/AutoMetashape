[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autometashape"
version = "1.3.0"
description = "AutoMetashape: Autonomous High-Precision 3D Photogrammetry Pipeline"
authors = [{ name = "AutoMetashape Contributors" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "B"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"
