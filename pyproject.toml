[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autometashape"
version = "1.4.0"
description = "AutoMetashape: Autonomous High-Precision 3D Photogrammetry Pipeline"
authors = [{ name = "AutoMetashape Contributors" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["source"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # Line length handled by ruff format
    "E402",  # Module-level imports after sys.path manipulation in scripts/tests
    "B008",  # Function calls in argument defaults
    "B905",  # zip() without explicit strict= parameter
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["F401", "I001"]
"tests/*" = ["F401", "F811"]
