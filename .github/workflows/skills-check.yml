name: Agent Skills Governance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  skills-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate Skills Architecture & Governance Rules
        run: |
          python tools/skills/cli.py check
